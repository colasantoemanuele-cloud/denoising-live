; =====================================================================
;  denoising_live - file di configurazione
;  Righe che iniziano con ';' sono commenti.  Numeri con punto o virgola.
;  Il programma riscrive questo file quando si cambiano le impostazioni
;  dalla finestra (i commenti vengono conservati).
; =====================================================================

[generale]
; Modalita' all'avvio: chiedi, simulazione oppure digidata.
; La riga di comando (--simulazione / --digidata) ha la precedenza.
modalita = chiedi
; Cartella dove salvare le registrazioni (anche chiavetta o disco esterno,
; es. E:\registrazioni).  Un percorso relativo e' relativo alla cartella
; del programma.
cartella_dati = dati_registrati
; Cartella dei file di log (con rotazione automatica).
cartella_log = log
; Spazio libero minimo (MB) per poter iniziare a registrare.  Sotto
; questa soglia durante la registrazione compare un avviso.
spazio_minimo_mb = 200

[digidata]
; Ingresso analogico del Digidata da acquisire (BNC 0-15).  Il cavo
; dall'LPF-8 e' collegato all'ingresso 2.
canale_ingresso = 2
; Frequenza di acquisizione (Hz).  Il grezzo si salva a questa frequenza.
frequenza_acquisizione_hz = 1000
; Range di ingresso (V).  Il Digidata 1322A lavora sempre a +/-10 V.
range_v = 10
; Percorso completo di AxDD132x.dll.  Vuoto = ricerca automatica nei
; percorsi tipici (cartella di WinWCP, C:\Axon\..., system32, cartella
; dll del programma).
percorso_dll = 
; come_winwcp = imposta anche le uscite (DAC0, DAC1, digitali) a 0 V
; come fa WinWCP durante l'acquisizione; nessuna = solo ingressi.
uscite_analogiche = come_winwcp
; Dimensione del buffer circolare nella memoria del PC (campioni).
; 1 000 000 come WinWCP: a 1000 Hz sono circa 16 minuti di margine.
campioni_buffer = 1000000
; Ogni quanto si leggono i nuovi campioni dal buffer (ms).
intervallo_lettura_ms = 50

[simulazione]
; Cartella proposta per scegliere i file .wcp da riprodurre.
cartella = riferimenti/dati
; Ultimo file .wcp riprodotto (vuoto = chiedi).
file = 
; Record da riprodurre (1 = primo; 0 = tutti in sequenza).
record = 1
; Canale del file da riprodurre (-1 = scegli automaticamente quello col segnale).
canale = -1
; Fattore di velocita' (1, 5, 20...).
velocita = 1
; Salta la coda costante dei record fermati prima della fine.
salta_coda = si
; Interpola a frequenza_sovracampionamento_hz per provare la stessa
; catena della modalita' Digidata.
sovracampiona = no
frequenza_sovracampionamento_hz = 1000
; Aggiunge rumore sintetico: sinusoidi a 50, 8,7 e 37,4 Hz, banda
; 25-50 Hz e rari picchi di saturazione.
rumore_sintetico = no

[filtro]
; Passa-basso: bessel (gradini senza sovraelongazione, predefinito)
; oppure butterworth (taglia di piu' ma sovraelonga: 11 % al 4 ordine).
tipo = bessel
; Ordine del passa-basso (1-10).
ordine = 4
; Frequenza di taglio (-3 dB) del passa-basso digitale (Hz).
; Regolabile anche dal vivo.
taglio_hz = 5
; Frequenze dei notch separate da ';' (es. 50 ; 8,7).  Vuoto = nessuno.
notch_hz = 50
; Fattore di qualita' dei notch (30 = banda di 1,7 Hz a 50 Hz).
q_notch = 30
; Conteggi ADC oltre i quali un campione e' considerato saturato:
; il filtro usa l'ultimo valore valido (il grezzo salvato resta intatto).
soglia_saturazione = 32700
; Picchi isolati: campioni che si scostano dall'ultimo valore valido di
; piu' di questa soglia (mV) vengono trattati come la saturazione, se
; durano meno di durata_max_picco_ms.  0 = disattivato.
soglia_picchi_mv = 500
; Attesa (ms, 0-500): uno scostamento oltre soglia_picchi_mv che dura meno di
; cosi' e' un picco e si toglie; se dura di piu' e' segnale vero e passa, ma i
; suoi primi durata_max_picco_ms sono sostituiti dall'ultimo valore valido.
; Se il laboratorio dice che gli impulsi veri sono segnale, si abbassa.
durata_max_picco_ms = 50

[salvataggio]
; Frequenza del file filtrato (Hz).  Deve dividere esattamente la
; frequenza di acquisizione (1000/125 = 8).
frequenza_salvataggio_hz = 125
; Durata di ogni record nei file .wcp (s).  La durata effettiva e'
; arrotondata perche' ogni record occupi un numero intero di settori.
durata_record_s = 60
; Ogni quanto si scrive su disco con fsync (s): in caso di crash si
; perde al massimo questo intervallo.
intervallo_scrittura_s = 1
; Separatore decimale nell'intestazione dei .wcp: virgola come i file
; esistenti (PC in italiano).  Usare punto solo se il PC del laboratorio
; ha le impostazioni internazionali inglesi.
separatore_decimale = virgola

[calibrazione]
; Fattore di calibrazione (V per unita'): 0,001 V/mV come nei file
; esistenti.  Se il guadagno dell'LPF-8 non e' 1, usare 0,001 x guadagno.
yg = 0,001
; Livello di zero (conteggi ADC).
yz = 0
; Unita' di misura.
unita = mV
; Nome del canale scritto nei file (max 8 caratteri).
nome_canale = AI2

[lpf8]
; Frequenza di taglio impostata sul Warner LPF-8 (Hz), da aggiornare
; a mano quando la si cambia.  Viene salvata nei metadati.
taglio_hz = 15
; Guadagno impostato sull'LPF-8 (solo annotazione).
guadagno = 1

[grafico]
; Finestra temporale iniziale (10, 30, 120, 600 s).
finestra_s = 30
; Aggiornamenti del grafico al secondo (2, 5 o 10; si cambia anche dalla finestra).
; 5 = circa 4 % di CPU sul PC di sviluppo; 10 e' piu' fluido ma costa ~7 %.
aggiornamento_hz = 5
; Scala Y automatica o fissa.
scala_y = auto
; Limite inferiore della scala fissa.
y_min = -150
; Limite superiore della scala fissa.
y_max = 150

[interfaccia]
; Dimensione di testi e controlli della finestra: auto (calcolata da
; risoluzione e DPI dello schermo) oppure una percentuale, es. 75, 100,
; 125, 150, 200.  100 = font di 12 punti, adatto a 1920x1080; 200 = adatto
; a uno schermo 4K.  Ha la precedenza sulla scala automatica.  Si cambia
; anche dalla finestra (Dimensione interfaccia), con effetto immediato.
dimensione = auto
